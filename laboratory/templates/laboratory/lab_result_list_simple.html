{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <h1>檢驗結果列表</h1>
    
    {% for result in page_obj %}
    <div class="card mb-3">
        <div class="card-body">
            <h5>{{ result.order_item.test_type.name }}</h5>
            <p>結果值: {{ result.result_value }}</p>
            <p>申請單: {{ result.order_item.lab_order.order_number|default:"無" }}</p>
        </div>
    </div>
    {% empty %}
    <p>沒有結果</p>
    {% endfor %}
</div>
{% endblock %}
