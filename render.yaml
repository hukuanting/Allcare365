services:
  - type: web
    name: allcare365-demo-api
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn medical_system.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health-check/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: medical_system.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OIDC_RSA_PRIVATE_KEY
        sync: false
      - key: CACHE_URL
        sync: false
      - key: PRIVATE_STORAGE_BACKEND
        sync: false
      - key: PRIVATE_STORAGE_BUCKET
        sync: false
      - key: PRIVATE_STORAGE_REGION
        sync: false

  - type: web
    name: allcare365-demo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
