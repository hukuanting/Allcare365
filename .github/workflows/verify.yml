name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allcare365
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d allcare365"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SECRET_KEY: ci-only-not-a-production-secret
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: medical_system.settings_security_tests
      MFA_REQUIRED_FOR_PRIVILEGED: "False"
      DB_NAME: allcare365
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest --reuse-db -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.example.test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
