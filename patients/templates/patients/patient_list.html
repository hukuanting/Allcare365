{% extends 'base.html' %}
{% load static %}

{% block title %}患者管理 - Allcare365{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <!-- 頁面標題 -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 fw-bold text-primary">
                    <i class="fas fa-users me-2"></i>患者管理
                </h1>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPatientModal">
                    <i class="fas fa-plus me-2"></i>新增患者
                </button>
            </div>

            <!-- 搜尋和篩選 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">搜尋患者</label>
                            <input type="text" class="form-control" id="searchInput" placeholder="姓名、身分證號、電話...">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">性別</label>
                            <select class="form-select" id="genderFilter">
                                <option value="">全部</option>
                                <option value="M">男性</option>
                                <option value="F">女性</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">狀態</label>
                            <select class="form-select" id="statusFilter">
                                <option value="">全部</option>
                                <option value="active">活躍</option>
                                <option value="inactive">非活躍</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-outline-primary w-100" onclick="searchPatients()">
                                <i class="fas fa-search me-2"></i>搜尋
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 患者列表 -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">患者列表</h5>
                </div>
                <div class="card-body">
                    <div id="patientsTable">
                        <!-- 患者資料將通過AJAX載入 -->
                        <div class="text-center py-5">
                            <div class="loading"></div>
                            <p class="mt-3">載入中...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 分頁導航 -->
            <nav class="mt-4" id="paginationNav" style="display: none;">
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- 分頁按鈕將動態生成 -->
                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- 新增患者 Modal -->
<div class="modal fade" id="addPatientModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增患者</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addPatientForm">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">姓名 *</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">身分證號 *</label>
                            <input type="text" class="form-control" name="id_number" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">出生日期 *</label>
                            <input type="date" class="form-control" name="date_of_birth" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">性別 *</label>
                            <select class="form-select" name="gender" required>
                                <option value="">請選擇</option>
                                <option value="M">男性</option>
                                <option value="F">女性</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">電話</label>
                            <input type="tel" class="form-control" name="phone">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">電子郵件</label>
                            <input type="email" class="form-control" name="email">
                        </div>
                        <div class="col-12">
                            <label class="form-label">地址</label>
                            <textarea class="form-control" name="address" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="savePatient()">
                    <i class="fas fa-save me-2"></i>儲存
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.patient-card {
    transition: all 0.3s ease;
    cursor: pointer;
}

.patient-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.patient-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.2rem;
    color: white;
}

.status-badge {
    font-size: 0.8rem;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
}

.status-active {
    background: #d1fae5;
    color: #065f46;
}

.status-inactive {
    background: #fee2e2;
    color: #991b1b;
}
</style>

<script>
let currentPage = 1;
let totalPages = 1;

document.addEventListener('DOMContentLoaded', function() {
    loadPatients();
});

function loadPatients(page = 1) {
    const search = document.getElementById('searchInput').value;
    const gender = document.getElementById('genderFilter').value;
    const status = document.getElementById('statusFilter').value;
    
    const params = new URLSearchParams({
        page: page,
        search: search,
        gender: gender,
        status: status
    });
    
    fetch(`/patients/api/list/?${params}`)
        .then(response => response.json())
        .then(data => {
            displayPatients(data.patients);
            updatePagination(data.pagination);
            currentPage = page;
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('patientsTable').innerHTML = `
                <div class="text-center py-5">
                    <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
                    <p>載入患者資料時發生錯誤</p>
                    <button class="btn btn-outline-primary" onclick="loadPatients()">重新載入</button>
                </div>
            `;
        });
}

function displayPatients(patients) {
    const container = document.getElementById('patientsTable');
    
    if (patients.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5">
                <i class="fas fa-user-slash text-muted fa-3x mb-3"></i>
                <p>沒有找到符合條件的患者</p>
            </div>
        `;
        return;
    }
    
    const patientsHtml = patients.map(patient => `
        <div class="patient-card card mb-3" onclick="viewPatient('${patient.id}')">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-1">
                        <div class="patient-avatar" style="background: ${getAvatarColor(patient.name)}">
                            ${patient.name.charAt(0)}
                        </div>
                    </div>
                    <div class="col-md-3">
                        <h6 class="mb-1">${patient.name}</h6>
                        <small class="text-muted">${patient.id_number}</small>
                    </div>
                    <div class="col-md-2">
                        <span class="badge ${patient.gender === 'M' ? 'bg-primary' : 'bg-info'}">${patient.gender === 'M' ? '男性' : '女性'}</span>
                    </div>
                    <div class="col-md-2">
                        <small class="text-muted">${patient.age}歲</small>
                    </div>
                    <div class="col-md-2">
                        <small class="text-muted">${patient.phone || '無電話'}</small>
                    </div>
                    <div class="col-md-2">
                        <span class="status-badge ${patient.is_active ? 'status-active' : 'status-inactive'}">
                            ${patient.is_active ? '活躍' : '非活躍'}
                        </span>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
    
    container.innerHTML = patientsHtml;
}

function updatePagination(pagination) {
    totalPages = pagination.total_pages;
    const paginationNav = document.getElementById('paginationNav');
    const paginationUl = document.getElementById('pagination');
    
    if (totalPages <= 1) {
        paginationNav.style.display = 'none';
        return;
    }
    
    paginationNav.style.display = 'block';
    
    let paginationHtml = '';
    
    // 上一頁
    if (pagination.has_previous) {
        paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="loadPatients(${pagination.current_page - 1})">上一頁</a></li>`;
    }
    
    // 頁碼
    for (let i = 1; i <= totalPages; i++) {
        if (i === pagination.current_page) {
            paginationHtml += `<li class="page-item active"><span class="page-link">${i}</span></li>`;
        } else {
            paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="loadPatients(${i})">${i}</a></li>`;
        }
    }
    
    // 下一頁
    if (pagination.has_next) {
        paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="loadPatients(${pagination.current_page + 1})">下一頁</a></li>`;
    }
    
    paginationUl.innerHTML = paginationHtml;
}

function searchPatients() {
    loadPatients(1);
}

function getAvatarColor(name) {
    const colors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4'];
    const charCode = name.charCodeAt(0);
    return colors[charCode % colors.length];
}

function viewPatient(patientId) {
    window.location.href = `/patients/${patientId}/`;
}

function savePatient() {
    const form = document.getElementById('addPatientForm');
    const formData = new FormData(form);
    
    fetch('/patients/api/create/', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            bootstrap.Modal.getInstance(document.getElementById('addPatientModal')).hide();
            form.reset();
            loadPatients(currentPage);
            
            // 顯示成功訊息
            const alert = document.createElement('div');
            alert.className = 'alert alert-success alert-dismissible fade show';
            alert.innerHTML = `
                <i class="fas fa-check-circle me-2"></i>患者新增成功！
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.querySelector('.container-fluid').prepend(alert);
        } else {
            alert('儲存失敗：' + (data.error || '未知錯誤'));
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('儲存時發生錯誤');
    });
}

// 搜尋框輸入事件
document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        searchPatients();
    }
});
</script>
{% endblock %}
