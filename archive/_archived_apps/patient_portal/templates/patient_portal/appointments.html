{% extends 'patient_portal/base.html' %}

{% block title %}Appointments - Patient Portal{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Appointments</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#scheduleModal">
                <i class="fas fa-calendar-plus"></i> Schedule Appointment
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshAppointments()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
    </div>
</div>

<!-- Filter Controls -->
<div class="row mb-4">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-filter"></i> Filter Appointments</h5>
            </div>
            <div class="card-body">
                <form id="filterForm">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="status_filter" class="form-label">Status</label>
                            <select class="form-select" id="status_filter" name="status">
                                <option value="">All Status</option>
                                <option value="scheduled">Scheduled</option>
                                <option value="confirmed">Confirmed</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="provider_filter" class="form-label">Provider</label>
                            <select class="form-select" id="provider_filter" name="provider">
                                <option value="">All Providers</option>
                                <!-- Will be populated via AJAX -->
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="date_from" class="form-label">From Date</label>
                            <input type="date" class="form-control" id="date_from" name="date_from">
                        </div>
                        <div class="col-md-3">
                            <label for="date_to" class="form-label">To Date</label>
                            <input type="date" class="form-control" id="date_to" name="date_to">
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-search"></i> Filter
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="clearFilters()">
                                <i class="fas fa-times"></i> Clear
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Appointments List -->
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-calendar-alt"></i> Your Appointments</h5>
            </div>
            <div class="card-body">
                <div id="appointments-list">
                    <div class="d-flex justify-content-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Schedule Appointment Modal -->
<div class="modal fade" id="scheduleModal" tabindex="-1" aria-labelledby="scheduleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="scheduleModalLabel">
                    <i class="fas fa-calendar-plus"></i> Schedule New Appointment
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="scheduleForm">
                    <div class="row">
                        <div class="col-md-6">
                            <label for="appointment_type" class="form-label">Appointment Type</label>
                            <select class="form-select" id="appointment_type" name="appointment_type" required>
                                <option value="">Select Type</option>
                                <option value="consultation">Consultation</option>
                                <option value="follow-up">Follow-up</option>
                                <option value="physical">Physical Exam</option>
                                <option value="preventive">Preventive Care</option>
                                <option value="urgent">Urgent Care</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="preferred_provider" class="form-label">Preferred Provider</label>
                            <select class="form-select" id="preferred_provider" name="provider" required>
                                <option value="">Select Provider</option>
                                <!-- Will be populated via AJAX -->
                            </select>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label for="preferred_date" class="form-label">Preferred Date</label>
                            <input type="date" class="form-control" id="preferred_date" name="preferred_date" required>
                        </div>
                        <div class="col-md-6">
                            <label for="preferred_time" class="form-label">Preferred Time</label>
                            <select class="form-select" id="preferred_time" name="preferred_time" required>
                                <option value="">Select Time</option>
                                <option value="morning">Morning (8 AM - 12 PM)</option>
                                <option value="afternoon">Afternoon (12 PM - 5 PM)</option>
                                <option value="evening">Evening (5 PM - 8 PM)</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-12">
                            <label for="reason" class="form-label">Reason for Visit</label>
                            <textarea class="form-control" id="reason" name="reason" rows="3" required></textarea>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-12">
                            <label for="notes" class="form-label">Additional Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="2"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="scheduleAppointment()">
                    <i class="fas fa-calendar-plus"></i> Schedule Appointment
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Appointment Details Modal -->
<div class="modal fade" id="appointmentModal" tabindex="-1" aria-labelledby="appointmentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="appointmentModalLabel">
                    <i class="fas fa-calendar-alt"></i> Appointment Details
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="appointmentDetails">
                <!-- Will be populated via AJAX -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-warning" onclick="rescheduleAppointment()">
                    <i class="fas fa-calendar-check"></i> Reschedule
                </button>
                <button type="button" class="btn btn-danger" onclick="cancelAppointment()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentFilters = {};
let selectedAppointmentId = null;

function loadAppointments(filters = {}) {
    currentFilters = filters;
    
    $('#appointments-list').html('<div class="d-flex justify-content-center"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>');
    
    $.ajax({
        url: '{% url "patient_portal:get_appointments_ajax" %}',
        method: 'GET',
        data: filters,
        success: function(data) {
            displayAppointments(data.appointments);
        },
        error: function(xhr, status, error) {
            $('#appointments-list').html('<div class="alert alert-danger">Error loading appointments. Please try again.</div>');
        }
    });
}

function displayAppointments(appointments) {
    const container = $('#appointments-list');
    container.empty();
    
    if (appointments && appointments.length > 0) {
        let appointmentsHtml = '<div class="table-responsive"><table class="table table-hover"><thead><tr><th>Date & Time</th><th>Provider</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
        
        appointments.forEach(function(appointment) {
            const statusClass = getStatusClass(appointment.status);
            appointmentsHtml += `
                <tr>
                    <td>${appointment.date_time}</td>
                    <td>${appointment.provider}</td>
                    <td>${appointment.type}</td>
                    <td><span class="badge ${statusClass}">${appointment.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="viewAppointment(${appointment.id})">
                            <i class="fas fa-eye"></i> View
                        </button>
                        ${appointment.can_reschedule ? `<button class="btn btn-sm btn-outline-warning me-1" onclick="rescheduleAppointment(${appointment.id})"><i class="fas fa-calendar-check"></i> Reschedule</button>` : ''}
                        ${appointment.can_cancel ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelAppointment(${appointment.id})"><i class="fas fa-times"></i> Cancel</button>` : ''}
                    </td>
                </tr>
            `;
        });
        
        appointmentsHtml += '</tbody></table></div>';
        container.html(appointmentsHtml);
    } else {
        container.html('<div class="text-center"><p class="text-muted">No appointments found</p><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#scheduleModal"><i class="fas fa-calendar-plus"></i> Schedule Your First Appointment</button></div>');
    }
}

function getStatusClass(status) {
    switch (status) {
        case 'scheduled': return 'bg-info';
        case 'confirmed': return 'bg-success';
        case 'completed': return 'bg-secondary';
        case 'cancelled': return 'bg-danger';
        default: return 'bg-secondary';
    }
}

function scheduleAppointment() {
    const formData = $('#scheduleForm').serialize();
    
    $.ajax({
        url: '{% url "patient_portal:schedule_appointment_ajax" %}',
        method: 'POST',
        data: formData,
        success: function(response) {
            if (response.success) {
                $('#scheduleModal').modal('hide');
                $('#scheduleForm')[0].reset();
                loadAppointments(currentFilters);
                showAlert('success', 'Appointment scheduled successfully!');
            } else {
                showAlert('danger', 'Error scheduling appointment: ' + response.message);
            }
        },
        error: function(xhr, status, error) {
            showAlert('danger', 'Error scheduling appointment. Please try again.');
        }
    });
}

function viewAppointment(appointmentId) {
    selectedAppointmentId = appointmentId;
    
    // Mock appointment details
    const appointmentDetails = `
        <div class="row">
            <div class="col-md-6">
                <h6><i class="fas fa-calendar-alt"></i> Appointment Information</h6>
                <p><strong>Date:</strong> March 25, 2024</p>
                <p><strong>Time:</strong> 10:00 AM</p>
                <p><strong>Duration:</strong> 30 minutes</p>
                <p><strong>Type:</strong> Follow-up</p>
                <p><strong>Status:</strong> <span class="badge bg-success">Confirmed</span></p>
            </div>
            <div class="col-md-6">
                <h6><i class="fas fa-user-md"></i> Provider Information</h6>
                <p><strong>Provider:</strong> Dr. John Smith</p>
                <p><strong>Specialty:</strong> Internal Medicine</p>
                <p><strong>Location:</strong> Main Clinic, Room 205</p>
                <p><strong>Phone:</strong> (555) 123-4567</p>
            </div>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-12">
                <h6><i class="fas fa-clipboard-list"></i> Appointment Details</h6>
                <p><strong>Reason:</strong> Diabetes follow-up and blood pressure check</p>
                <p><strong>Notes:</strong> Bring current medication list and glucose log</p>
            </div>
        </div>
    `;
    
    $('#appointmentDetails').html(appointmentDetails);
    $('#appointmentModal').modal('show');
}

function rescheduleAppointment(appointmentId = null) {
    if (appointmentId) {
        selectedAppointmentId = appointmentId;
    }
    
    // For now, just show an alert
    showAlert('info', 'Reschedule functionality would be implemented here');
}

function cancelAppointment(appointmentId = null) {
    if (appointmentId) {
        selectedAppointmentId = appointmentId;
    }
    
    if (confirm('Are you sure you want to cancel this appointment?')) {
        // Mock cancellation
        showAlert('success', 'Appointment cancelled successfully');
        $('#appointmentModal').modal('hide');
        loadAppointments(currentFilters);
    }
}

function refreshAppointments() {
    loadAppointments(currentFilters);
}

function clearFilters() {
    $('#filterForm')[0].reset();
    currentFilters = {};
    loadAppointments();
}

function showAlert(type, message) {
    const alertHtml = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
    
    $('body').prepend(alertHtml);
    
    // Auto-dismiss after 5 seconds
    setTimeout(function() {
        $('.alert').alert('close');
    }, 5000);
}

// Filter form submission
$('#filterForm').on('submit', function(e) {
    e.preventDefault();
    const filters = {};
    
    $(this).serializeArray().forEach(function(item) {
        if (item.value) {
            filters[item.name] = item.value;
        }
    });
    
    loadAppointments(filters);
});

// Load appointments on page load
$(document).ready(function() {
    loadAppointments();
    
    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    $('#preferred_date').attr('min', today);
    $('#date_from').attr('min', '2020-01-01');
    $('#date_to').attr('min', '2020-01-01');
});
</script>
{% endblock %}
