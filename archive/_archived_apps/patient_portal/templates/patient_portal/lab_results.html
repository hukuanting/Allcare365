{% extends 'patient_portal/base.html' %}

{% block title %}Lab Results - Patient Portal{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Lab Results</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <div class="btn-group me-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="exportResults()">
                <i class="fas fa-download"></i> Export
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshResults()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
    </div>
</div>

<!-- Filter Controls -->
<div class="row mb-4">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-filter"></i> Filter Lab Results</h5>
            </div>
            <div class="card-body">
                <form id="filterForm">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="test_type" class="form-label">Test Type</label>
                            <select class="form-select" id="test_type" name="test_type">
                                <option value="">All Types</option>
                                <option value="blood">Blood Tests</option>
                                <option value="urine">Urine Tests</option>
                                <option value="chemistry">Chemistry Panel</option>
                                <option value="lipid">Lipid Panel</option>
                                <option value="thyroid">Thyroid Function</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="status_filter" class="form-label">Status</label>
                            <select class="form-select" id="status_filter" name="status">
                                <option value="">All Status</option>
                                <option value="normal">Normal</option>
                                <option value="abnormal">Abnormal</option>
                                <option value="critical">Critical</option>
                                <option value="pending">Pending</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="date_from" class="form-label">From Date</label>
                            <input type="date" class="form-control" id="date_from" name="date_from">
                        </div>
                        <div class="col-md-3">
                            <label for="date_to" class="form-label">To Date</label>
                            <input type="date" class="form-control" id="date_to" name="date_to">
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-search"></i> Filter
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="clearFilters()">
                                <i class="fas fa-times"></i> Clear
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Lab Results List -->
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-flask"></i> Your Lab Results</h5>
            </div>
            <div class="card-body">
                <div id="lab-results-list">
                    <div class="d-flex justify-content-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Lab Result Details Modal -->
<div class="modal fade" id="labResultModal" tabindex="-1" aria-labelledby="labResultModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="labResultModalLabel">
                    <i class="fas fa-vial"></i> Lab Result Details
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="labResultDetails">
                <!-- Will be populated via AJAX -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="downloadResult()">
                    <i class="fas fa-download"></i> Download PDF
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentFilters = {};
let selectedLabResultId = null;

function loadLabResults(filters = {}) {
    currentFilters = filters;
    
    $('#lab-results-list').html('<div class="d-flex justify-content-center"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>');
    
    $.ajax({
        url: '{% url "patient_portal:get_lab_results_ajax" %}',
        method: 'GET',
        data: filters,
        success: function(data) {
            displayLabResults(data.lab_results);
        },
        error: function(xhr, status, error) {
            // Mock data for demonstration
            const mockLabResults = [
                {
                    id: 1,
                    test_name: 'Complete Blood Count (CBC)',
                    test_date: 'March 15, 2024',
                    result_date: 'March 16, 2024',
                    status: 'normal',
                    ordering_provider: 'Dr. John Smith',
                    has_abnormal_values: false
                },
                {
                    id: 2,
                    test_name: 'Lipid Panel',
                    test_date: 'March 10, 2024',
                    result_date: 'March 11, 2024',
                    status: 'abnormal',
                    ordering_provider: 'Dr. Jane Doe',
                    has_abnormal_values: true
                },
                {
                    id: 3,
                    test_name: 'Thyroid Function Tests',
                    test_date: 'February 20, 2024',
                    result_date: 'February 21, 2024',
                    status: 'normal',
                    ordering_provider: 'Dr. John Smith',
                    has_abnormal_values: false
                }
            ];
            displayLabResults(mockLabResults);
        }
    });
}

function displayLabResults(labResults) {
    const container = $('#lab-results-list');
    container.empty();
    
    if (labResults && labResults.length > 0) {
        let resultsHtml = '<div class="table-responsive"><table class="table table-hover"><thead><tr><th>Test Name</th><th>Test Date</th><th>Result Date</th><th>Status</th><th>Ordering Provider</th><th>Actions</th></tr></thead><tbody>';
        
        labResults.forEach(function(result) {
            const statusClass = getStatusClass(result.status);
            resultsHtml += `
                <tr>
                    <td><strong>${result.test_name}</strong> ${result.has_abnormal_values ? '<i class="fas fa-exclamation-triangle text-warning" title="Contains abnormal values"></i>' : ''}</td>
                    <td>${result.test_date}</td>
                    <td>${result.result_date}</td>
                    <td><span class="badge ${statusClass}">${result.status}</span></td>
                    <td>${result.ordering_provider}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="viewLabResult(${result.id})">
                            <i class="fas fa-eye"></i> View
                        </button>
                        <button class="btn btn-sm btn-outline-success" onclick="downloadResult(${result.id})">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </td>
                </tr>
            `;
        });
        
        resultsHtml += '</tbody></table></div>';
        container.html(resultsHtml);
    } else {
        container.html('<div class="text-center"><p class="text-muted">No lab results found</p></div>');
    }
}

function getStatusClass(status) {
    switch (status) {
        case 'normal': return 'bg-success';
        case 'abnormal': return 'bg-warning';
        case 'critical': return 'bg-danger';
        case 'pending': return 'bg-info';
        default: return 'bg-secondary';
    }
}

function viewLabResult(labResultId) {
    selectedLabResultId = labResultId;
    
    // Mock lab result details
    const labResultDetails = `
        <div class="row">
            <div class="col-md-6">
                <h6><i class="fas fa-flask"></i> Test Information</h6>
                <p><strong>Test Name:</strong> Complete Blood Count (CBC)</p>
                <p><strong>Test Date:</strong> March 15, 2024</p>
                <p><strong>Result Date:</strong> March 16, 2024</p>
                <p><strong>Status:</strong> <span class="badge bg-success">Normal</span></p>
                <p><strong>Ordering Provider:</strong> Dr. John Smith</p>
            </div>
            <div class="col-md-6">
                <h6><i class="fas fa-info-circle"></i> Collection Information</h6>
                <p><strong>Collection Date:</strong> March 15, 2024 09:30 AM</p>
                <p><strong>Collection Method:</strong> Venipuncture</p>
                <p><strong>Fasting Required:</strong> No</p>
                <p><strong>Lab:</strong> Quest Diagnostics</p>
            </div>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-12">
                <h6><i class="fas fa-chart-line"></i> Test Results</h6>
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Test</th>
                                <th>Result</th>
                                <th>Reference Range</th>
                                <th>Unit</th>
                                <th>Flag</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>White Blood Cell Count</td>
                                <td>6.8</td>
                                <td>4.0 - 11.0</td>
                                <td>K/uL</td>
                                <td><span class="badge bg-success">Normal</span></td>
                            </tr>
                            <tr>
                                <td>Red Blood Cell Count</td>
                                <td>4.5</td>
                                <td>4.2 - 5.4</td>
                                <td>M/uL</td>
                                <td><span class="badge bg-success">Normal</span></td>
                            </tr>
                            <tr>
                                <td>Hemoglobin</td>
                                <td>14.2</td>
                                <td>12.0 - 16.0</td>
                                <td>g/dL</td>
                                <td><span class="badge bg-success">Normal</span></td>
                            </tr>
                            <tr>
                                <td>Hematocrit</td>
                                <td>42.1</td>
                                <td>36.0 - 46.0</td>
                                <td>%</td>
                                <td><span class="badge bg-success">Normal</span></td>
                            </tr>
                            <tr>
                                <td>Platelet Count</td>
                                <td>285</td>
                                <td>150 - 450</td>
                                <td>K/uL</td>
                                <td><span class="badge bg-success">Normal</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-12">
                <h6><i class="fas fa-comments"></i> Provider Comments</h6>
                <p>All values within normal limits. Continue current medications and lifestyle modifications.</p>
            </div>
        </div>
    `;
    
    $('#labResultDetails').html(labResultDetails);
    $('#labResultModal').modal('show');
}

function downloadResult(labResultId = null) {
    if (labResultId) {
        selectedLabResultId = labResultId;
    }
    
    // Mock download
    showAlert('info', 'Download functionality would be implemented here');
}

function exportResults() {
    // Mock export
    showAlert('info', 'Export functionality would be implemented here');
}

function refreshResults() {
    loadLabResults(currentFilters);
}

function clearFilters() {
    $('#filterForm')[0].reset();
    currentFilters = {};
    loadLabResults();
}

function showAlert(type, message) {
    const alertHtml = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
    
    $('body').prepend(alertHtml);
    
    // Auto-dismiss after 5 seconds
    setTimeout(function() {
        $('.alert').alert('close');
    }, 5000);
}

// Filter form submission
$('#filterForm').on('submit', function(e) {
    e.preventDefault();
    const filters = {};
    
    $(this).serializeArray().forEach(function(item) {
        if (item.value) {
            filters[item.name] = item.value;
        }
    });
    
    loadLabResults(filters);
});

// Load lab results on page load
$(document).ready(function() {
    loadLabResults();
});
</script>
{% endblock %}
