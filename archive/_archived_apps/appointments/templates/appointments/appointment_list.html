{% extends 'base.html' %}
{% load static %}

{% block title %}預約管理 - Allcare365{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <!-- 頁面標題 -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h3 fw-bold text-primary">
                    <i class="fas fa-calendar-check me-2"></i>預約管理
                </h1>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAppointmentModal">
                    <i class="fas fa-plus me-2"></i>新增預約
                </button>
            </div>

            <!-- 快速統計 -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="fas fa-calendar-day fa-2x text-primary mb-2"></i>
                            <h4 class="text-primary">0</h4>
                            <p class="text-muted mb-0">今日預約</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="fas fa-clock fa-2x text-warning mb-2"></i>
                            <h4 class="text-warning">0</h4>
                            <p class="text-muted mb-0">待確認</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="fas fa-check-circle fa-2x text-success mb-2"></i>
                            <h4 class="text-success">0</h4>
                            <p class="text-muted mb-0">已完成</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <i class="fas fa-times-circle fa-2x text-danger mb-2"></i>
                            <h4 class="text-danger">0</h4>
                            <p class="text-muted mb-0">已取消</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 篩選選項 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">日期範圍</label>
                            <input type="date" class="form-control" id="dateFrom">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">至</label>
                            <input type="date" class="form-control" id="dateTo">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">狀態</label>
                            <select class="form-select" id="statusFilter">
                                <option value="">全部狀態</option>
                                <option value="pending">待確認</option>
                                <option value="confirmed">已確認</option>
                                <option value="completed">已完成</option>
                                <option value="cancelled">已取消</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button class="btn btn-outline-primary w-100" onclick="filterAppointments()">
                                <i class="fas fa-filter me-2"></i>篩選
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 預約列表 -->
            <div class="card">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">預約列表</h5>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm active" onclick="switchView('list')">
                                <i class="fas fa-list"></i>
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="switchView('calendar')">
                                <i class="fas fa-calendar"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <!-- 列表視圖 -->
                    <div id="listView">
                        <div class="text-center py-5">
                            <i class="fas fa-calendar-times text-muted fa-3x mb-3"></i>
                            <h5 class="text-muted">目前沒有預約記錄</h5>
                            <p class="text-muted">您可以點擊上方的「新增預約」按鈕來建立第一個預約</p>
                        </div>
                    </div>

                    <!-- 日曆視圖 -->
                    <div id="calendarView" style="display: none;">
                        <div class="text-center py-5">
                            <i class="fas fa-calendar text-muted fa-3x mb-3"></i>
                            <h5 class="text-muted">日曆視圖</h5>
                            <p class="text-muted">日曆功能開發中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 新增預約 Modal -->
<div class="modal fade" id="addAppointmentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增預約</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addAppointmentForm">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">患者 *</label>
                            <select class="form-select" name="patient_id" required>
                                <option value="">請選擇患者</option>
                                <!-- 患者選項將通過API載入 -->
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">醫生 *</label>
                            <select class="form-select" name="doctor_id" required>
                                <option value="">請選擇醫生</option>
                                <!-- 醫生選項將通過API載入 -->
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">預約日期 *</label>
                            <input type="date" class="form-control" name="appointment_date" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">預約時間 *</label>
                            <input type="time" class="form-control" name="appointment_time" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">預約類型</label>
                            <select class="form-select" name="appointment_type">
                                <option value="consultation">諮詢</option>
                                <option value="checkup">健康檢查</option>
                                <option value="follow_up">追蹤</option>
                                <option value="emergency">急診</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">狀態</label>
                            <select class="form-select" name="status">
                                <option value="pending">待確認</option>
                                <option value="confirmed">已確認</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">備註</label>
                            <textarea class="form-control" name="notes" rows="3" placeholder="預約相關備註..."></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveAppointment()">
                    <i class="fas fa-save me-2"></i>儲存
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.appointment-card {
    transition: all 0.3s ease;
    cursor: pointer;
}

.appointment-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.status-badge {
    font-size: 0.8rem;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
}

.status-pending {
    background: #fef3c7;
    color: #92400e;
}

.status-confirmed {
    background: #dbeafe;
    color: #1e40af;
}

.status-completed {
    background: #d1fae5;
    color: #065f46;
}

.status-cancelled {
    background: #fee2e2;
    color: #991b1b;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadAppointments();
    loadPatients();
    loadDoctors();
});

function loadAppointments() {
    // 模擬載入預約資料
    // 實際應用中這裡會發送API請求
    console.log('載入預約資料...');
}

function loadPatients() {
    // 載入患者選項
    fetch('/patients/api/list/')
        .then(response => response.json())
        .then(data => {
            const select = document.querySelector('select[name="patient_id"]');
            data.patients.forEach(patient => {
                const option = document.createElement('option');
                option.value = patient.id;
                option.textContent = patient.name;
                select.appendChild(option);
            });
        })
        .catch(error => console.error('載入患者資料失敗:', error));
}

function loadDoctors() {
    // 載入醫生選項 - 這裡使用模擬資料
    const doctors = [
        { id: 1, name: '張醫師' },
        { id: 2, name: '李醫師' },
        { id: 3, name: '王醫師' }
    ];
    
    const select = document.querySelector('select[name="doctor_id"]');
    doctors.forEach(doctor => {
        const option = document.createElement('option');
        option.value = doctor.id;
        option.textContent = doctor.name;
        select.appendChild(option);
    });
}

function filterAppointments() {
    console.log('篩選預約...');
    // 實作篩選功能
}

function switchView(viewType) {
    const listView = document.getElementById('listView');
    const calendarView = document.getElementById('calendarView');
    const buttons = document.querySelectorAll('.btn-group .btn');
    
    buttons.forEach(btn => btn.classList.remove('active'));
    
    if (viewType === 'list') {
        listView.style.display = 'block';
        calendarView.style.display = 'none';
        buttons[0].classList.add('active');
    } else {
        listView.style.display = 'none';
        calendarView.style.display = 'block';
        buttons[1].classList.add('active');
    }
}

function saveAppointment() {
    const form = document.getElementById('addAppointmentForm');
    const formData = new FormData(form);
    
    // 這裡應該發送API請求儲存預約
    console.log('儲存預約:', Object.fromEntries(formData));
    
    // 模擬儲存成功
    alert('預約新增成功！');
    bootstrap.Modal.getInstance(document.getElementById('addAppointmentModal')).hide();
    form.reset();
    loadAppointments();
}

// 設定預設日期
document.addEventListener('DOMContentLoaded', function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateFrom').value = today;
    document.getElementById('dateTo').value = today;
});
</script>
{% endblock %}
