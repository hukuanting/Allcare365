{% extends 'base.html' %}
{% load static %}

{% block title %}預約行事曆 - MedicalCare{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
<style>
    .calendar-container {
        background: white;
        border-radius: 0.35rem;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        padding: 1.5rem;
        min-height: 600px;
    }
    
    .calendar-controls {
        background: white;
        border-radius: 0.35rem;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        padding: 1rem;
        margin-bottom: 1.5rem;
    }
    
    .fc-event {
        cursor: pointer;
        border: none;
        border-radius: 0.25rem;
    }
    
    .fc-event-title {
        font-weight: 600;
    }
    
    .appointment-confirmed {
        background-color: #1cc88a !important;
    }
    
    .appointment-pending {
        background-color: #f6c23e !important;
    }
    
    .appointment-cancelled {
        background-color: #e74a3b !important;
    }
    
    .appointment-completed {
        background-color: #5a5c69 !important;
    }
    
    .legend-container {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-bottom: 1rem;
    }
    
    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    
    .legend-color {
        width: 15px;
        height: 15px;
        border-radius: 0.25rem;
    }
    
    .stats-row {
        margin-bottom: 1.5rem;
    }
    
    .stat-card {
        background: linear-gradient(45deg, #4e73df, #224abe);
        color: white;
        border-radius: 0.35rem;
        padding: 1rem;
        text-align: center;
    }
    
    .stat-number {
        font-size: 2rem;
        font-weight: bold;
    }
    
    .stat-label {
        font-size: 0.9rem;
        opacity: 0.9;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    
    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-calendar-alt text-primary"></i>
            預約行事曆
        </h1>
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-primary" id="btnToday">
                <i class="fas fa-calendar-day"></i> 今天
            </button>
            <button type="button" class="btn btn-success" id="btnNewAppointment">
                <i class="fas fa-plus"></i> 新增預約
            </button>
            <button type="button" class="btn btn-info" id="btnRefresh">
                <i class="fas fa-sync-alt"></i> 重新整理
            </button>
        </div>
    </div>

    <!-- Statistics Row -->
    <div class="row stats-row">
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="stat-card">
                <div class="stat-number" id="todayTotal">0</div>
                <div class="stat-label">今日預約</div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="stat-card" style="background: linear-gradient(45deg, #1cc88a, #17a673);">
                <div class="stat-number" id="confirmedCount">0</div>
                <div class="stat-label">已確認</div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="stat-card" style="background: linear-gradient(45deg, #f6c23e, #dda20a);">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">待確認</div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="stat-card" style="background: linear-gradient(45deg, #36b9cc, #2c9faf);">
                <div class="stat-number" id="weeklyTotal">0</div>
                <div class="stat-label">本週預約</div>
            </div>
        </div>
    </div>

    <!-- Calendar Controls -->
    <div class="calendar-controls">
        <div class="row align-items-center">
            <div class="col-md-6">
                <div class="form-row">
                    <div class="col">
                        <select class="form-control" id="providerFilter">
                            <option value="">所有醫護人員</option>
                        </select>
                    </div>
                    <div class="col">
                        <select class="form-control" id="statusFilter">
                            <option value="">所有狀態</option>
                            <option value="scheduled">已安排</option>
                            <option value="confirmed">已確認</option>
                            <option value="completed">已完成</option>
                            <option value="cancelled">已取消</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="legend-container">
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #1cc88a;"></div>
                        <span>已確認</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #f6c23e;"></div>
                        <span>待確認</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #e74a3b;"></div>
                        <span>已取消</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #5a5c69;"></div>
                        <span>已完成</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Calendar -->
    <div class="calendar-container">
        <div id="calendar"></div>
    </div>

</div>

<!-- Appointment Detail Modal -->
<div class="modal fade" id="appointmentModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="appointmentModalTitle">預約詳情</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="appointmentModalBody">
                <!-- Appointment details will be loaded here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">關閉</button>
                <button type="button" class="btn btn-primary" id="editAppointment" style="display: none;">編輯</button>
                <button type="button" class="btn btn-success" id="confirmAppointment" style="display: none;">確認</button>
                <button type="button" class="btn btn-warning" id="rescheduleAppointment" style="display: none;">重新安排</button>
                <button type="button" class="btn btn-danger" id="cancelAppointment" style="display: none;">取消</button>
            </div>
        </div>
    </div>
</div>

<!-- New Appointment Modal -->
<div class="modal fade" id="newAppointmentModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增預約</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="newAppointmentForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="patientSearch">病患 *</label>
                                <input type="text" class="form-control" id="patientSearch" placeholder="搜尋病患姓名或ID" required>
                                <div id="patientSuggestions" class="list-group mt-1" style="display: none;"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="appointmentProvider">醫護人員 *</label>
                                <select class="form-control" id="appointmentProvider" required>
                                    <option value="">請選擇醫護人員</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="appointmentDate">預約日期 *</label>
                                <input type="date" class="form-control" id="appointmentDate" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="appointmentTime">預約時間 *</label>
                                <input type="time" class="form-control" id="appointmentTime" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="appointmentType">預約類型 *</label>
                                <select class="form-control" id="appointmentType" required>
                                    <option value="">請選擇預約類型</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="appointmentDuration">預計時長 (分鐘)</label>
                                <input type="number" class="form-control" id="appointmentDuration" value="30" min="15" max="240">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="appointmentNotes">備註</label>
                        <textarea class="form-control" id="appointmentNotes" rows="3" placeholder="預約相關備註..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveNewAppointment">建立預約</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script>
$(document).ready(function() {
    let calendar;
    let appointments = [];
    
    // Initialize calendar
    initializeCalendar();
    loadProviders();
    loadAppointmentTypes();
    loadStatistics();
    
    function initializeCalendar() {
        const calendarEl = document.getElementById('calendar');
        
        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'zh-tw',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            buttonText: {
                today: '今天',
                month: '月',
                week: '週',
                day: '日'
            },
            events: function(fetchInfo, successCallback, failureCallback) {
                loadAppointments(fetchInfo.start, fetchInfo.end, successCallback, failureCallback);
            },
            eventClick: function(info) {
                showAppointmentDetail(info.event.id);
            },
            dateClick: function(info) {
                // Set date for new appointment
                $('#appointmentDate').val(info.dateStr);
                $('#newAppointmentModal').modal('show');
            },
            height: 'auto',
            dayMaxEvents: 3,
            moreLinkText: '更多'
        });
        
        calendar.render();
    }
    
    function loadAppointments(start, end, successCallback, failureCallback) {
        const params = {
            start: start.toISOString().split('T')[0],
            end: end.toISOString().split('T')[0]
        };
        
        const provider = $('#providerFilter').val();
        const status = $('#statusFilter').val();
        
        if (provider) params.provider = provider;
        if (status) params.status = status;
        
        $.get('/api/v1/appointments/api/appointments/', params)
            .done(function(data) {
                appointments = data.results || data;
                const events = appointments.map(function(appointment) {
                    return {
                        id: appointment.id,
                        title: `${appointment.patient_name} - ${appointment.appointment_type_name}`,
                        start: appointment.appointment_date + 'T' + appointment.appointment_time,
                        end: appointment.end_time ? appointment.appointment_date + 'T' + appointment.end_time : null,
                        className: 'appointment-' + appointment.status,
                        extendedProps: appointment
                    };
                });
                successCallback(events);
                updateStatistics();
            })
            .fail(function() {
                failureCallback();
                showNotification('無法載入預約資料', 'error');
            });
    }
    
    function loadProviders() {
        $.get('/api/v1/administration/api/users/')
            .done(function(data) {
                const select = $('#providerFilter, #appointmentProvider');
                select.empty();
                $('#providerFilter').append('<option value="">所有醫護人員</option>');
                $('#appointmentProvider').append('<option value="">請選擇醫護人員</option>');
                
                if (data.results) {
                    data.results.forEach(function(provider) {
                        if (provider.role && (provider.role.includes('doctor') || provider.role.includes('nurse'))) {
                            const option = `<option value="${provider.id}">${provider.first_name} ${provider.last_name}</option>`;
                            select.append(option);
                        }
                    });
                }
            })
            .fail(function() {
                showNotification('無法載入醫護人員列表', 'error');
            });
    }
    
    function loadAppointmentTypes() {
        $.get('/api/v1/appointments/api/appointment-types/active/')
            .done(function(data) {
                const select = $('#appointmentType');
                select.empty().append('<option value="">請選擇預約類型</option>');
                data.forEach(function(type) {
                    select.append(`<option value="${type.id}" data-duration="${type.duration}">${type.name}</option>`);
                });
            })
            .fail(function() {
                showNotification('無法載入預約類型', 'error');
            });
    }
    
    function loadStatistics() {
        $.get('/api/v1/appointments/api/appointments/statistics/')
            .done(function(data) {
                $('#todayTotal').text(data.today_total || 0);
                $('#confirmedCount').text(data.confirmed_count || 0);
                $('#pendingCount').text(data.pending_count || 0);
                $('#weeklyTotal').text(data.weekly_total || 0);
            })
            .fail(function() {
                // Use default values if API fails
                $('#todayTotal, #confirmedCount, #pendingCount, #weeklyTotal').text(0);
            });
    }
    
    function updateStatistics() {
        const today = new Date().toISOString().split('T')[0];
        const todayAppointments = appointments.filter(app => app.appointment_date === today);
        const confirmedToday = todayAppointments.filter(app => app.status === 'confirmed');
        const pendingToday = todayAppointments.filter(app => app.status === 'scheduled');
        
        $('#todayTotal').text(todayAppointments.length);
        $('#confirmedCount').text(confirmedToday.length);
        $('#pendingCount').text(pendingToday.length);
    }
    
    function showAppointmentDetail(appointmentId) {
        const appointment = appointments.find(app => app.id == appointmentId);
        
        if (!appointment) {
            showNotification('找不到預約資料', 'error');
            return;
        }
        
        const modalBody = $('#appointmentModalBody');
        modalBody.html(`
            <div class="row">
                <div class="col-md-6">
                    <h6><i class="fas fa-user text-primary"></i> 病患資訊</h6>
                    <p><strong>姓名:</strong> ${appointment.patient_name}</p>
                    <p><strong>聯絡電話:</strong> ${appointment.patient_phone || '未提供'}</p>
                    <p><strong>電子郵件:</strong> ${appointment.patient_email || '未提供'}</p>
                </div>
                <div class="col-md-6">
                    <h6><i class="fas fa-user-md text-primary"></i> 醫護人員</h6>
                    <p><strong>姓名:</strong> ${appointment.provider_name}</p>
                    <p><strong>專科:</strong> ${appointment.provider_specialty || '一般科'}</p>
                </div>
            </div>
            <hr>
            <div class="row">
                <div class="col-md-6">
                    <h6><i class="fas fa-calendar text-primary"></i> 預約資訊</h6>
                    <p><strong>類型:</strong> ${appointment.appointment_type_name}</p>
                    <p><strong>日期:</strong> ${appointment.appointment_date}</p>
                    <p><strong>時間:</strong> ${appointment.appointment_time}</p>
                    <p><strong>狀態:</strong> <span class="badge badge-${getStatusColor(appointment.status)}">${getStatusText(appointment.status)}</span></p>
                </div>
                <div class="col-md-6">
                    <h6><i class="fas fa-notes-medical text-primary"></i> 備註</h6>
                    <p>${appointment.notes || '無備註'}</p>
                    ${appointment.reason ? `<p><strong>就診原因:</strong> ${appointment.reason}</p>` : ''}
                </div>
            </div>
        `);
        
        // Show/hide action buttons based on status
        const buttons = $('#appointmentModal .modal-footer button');
        buttons.hide();
        $('#appointmentModal .btn-secondary').show(); // Close button
        
        if (appointment.status === 'scheduled') {
            $('#confirmAppointment, #rescheduleAppointment, #cancelAppointment').show();
        } else if (appointment.status === 'confirmed') {
            $('#editAppointment, #rescheduleAppointment, #cancelAppointment').show();
        }
        
        $('#appointmentModal').data('appointment-id', appointmentId).modal('show');
    }
    
    function getStatusColor(status) {
        const colors = {
            'scheduled': 'warning',
            'confirmed': 'success',
            'completed': 'secondary',
            'cancelled': 'danger',
            'no-show': 'dark'
        };
        return colors[status] || 'secondary';
    }
    
    function getStatusText(status) {
        const texts = {
            'scheduled': '已安排',
            'confirmed': '已確認',
            'completed': '已完成',
            'cancelled': '已取消',
            'no-show': '未到'
        };
        return texts[status] || status;
    }
    
    // Event handlers
    $('#providerFilter, #statusFilter').on('change', function() {
        calendar.refetchEvents();
    });
    
    $('#btnToday').on('click', function() {
        calendar.today();
    });
    
    $('#btnNewAppointment').on('click', function() {
        $('#newAppointmentModal').modal('show');
    });
    
    $('#btnRefresh').on('click', function() {
        calendar.refetchEvents();
        loadStatistics();
    });
    
    // Patient search
    $('#patientSearch').on('input', function() {
        const query = $(this).val();
        if (query.length >= 2) {
            searchPatients(query);
        } else {
            $('#patientSuggestions').hide();
        }
    });
    
    function searchPatients(query) {
        $.get('/api/v1/patients/api/patients/', { search: query })
            .done(function(data) {
                const suggestions = $('#patientSuggestions');
                suggestions.empty();
                
                if (data.results && data.results.length > 0) {
                    data.results.slice(0, 5).forEach(function(patient) {
                        const item = $(`
                            <a href="#" class="list-group-item list-group-item-action" data-patient-id="${patient.id}">
                                <strong>${patient.first_name} ${patient.last_name}</strong>
                                <br>
                                <small class="text-muted">ID: ${patient.id} | 電話: ${patient.phone_number || '未提供'}</small>
                            </a>
                        `);
                        
                        item.on('click', function(e) {
                            e.preventDefault();
                            $('#patientSearch').val(`${patient.first_name} ${patient.last_name}`);
                            $('#newAppointmentForm').data('patient-id', patient.id);
                            suggestions.hide();
                        });
                        
                        suggestions.append(item);
                    });
                    suggestions.show();
                } else {
                    suggestions.html(`
                        <div class="list-group-item">
                            <small class="text-muted">找不到相符的病患</small>
                        </div>
                    `).show();
                }
            })
            .fail(function() {
                $('#patientSuggestions').hide();
            });
    }
    
    // Appointment type change
    $('#appointmentType').on('change', function() {
        const duration = $(this).find(':selected').data('duration');
        if (duration) {
            $('#appointmentDuration').val(duration);
        }
    });
    
    // Save new appointment
    $('#saveNewAppointment').on('click', function() {
        const form = $('#newAppointmentForm');
        const patientId = form.data('patient-id');
        
        if (!patientId) {
            showNotification('請選擇病患', 'error');
            return;
        }
        
        const formData = {
            patient: patientId,
            provider: $('#appointmentProvider').val(),
            appointment_date: $('#appointmentDate').val(),
            appointment_time: $('#appointmentTime').val(),
            appointment_type: $('#appointmentType').val(),
            duration: $('#appointmentDuration').val(),
            notes: $('#appointmentNotes').val()
        };
        
        $.post('/api/v1/appointments/api/appointments/', formData)
            .done(function() {
                $('#newAppointmentModal').modal('hide');
                showNotification('預約建立成功', 'success');
                calendar.refetchEvents();
                loadStatistics();
                
                // Reset form
                form[0].reset();
                form.removeData('patient-id');
            })
            .fail(function(xhr) {
                const errors = xhr.responseJSON;
                let message = '預約建立失敗';
                if (errors && typeof errors === 'object') {
                    message += ': ' + Object.values(errors).flat().join(', ');
                }
                showNotification(message, 'error');
            });
    });
    
    function showNotification(message, type) {
        const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
        const icon = type === 'success' ? 'check-circle' : 'exclamation-circle';
        
        const notification = $(`
            <div class="alert ${alertClass} alert-dismissible fade show position-fixed" 
                 style="top: 20px; right: 20px; z-index: 9999;" role="alert">
                <i class="fas fa-${icon}"></i> ${message}
                <button type="button" class="close" data-dismiss="alert">
                    <span>&times;</span>
                </button>
            </div>
        `);
        
        $('body').append(notification);
        
        setTimeout(function() {
            notification.alert('close');
        }, 3000);
    }
});
</script>
{% endblock %}
