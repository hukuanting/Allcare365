{% extends 'base.html' %}
{% load static %}

{% block title %}診療記錄管理 - MedicalCare{% endblock %}

{% block extra_css %}
<style>
    .encounter-card {
        border: 1px solid #e3e6f0;
        border-radius: 0.35rem;
        transition: all 0.3s;
        margin-bottom: 1rem;
    }
    
    .encounter-card:hover {
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        transform: translateY(-2px);
    }
    
    .status-badge {
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        border-radius: 10rem;
    }
    
    .status-scheduled { background-color: #f6c23e; color: white; }
    .status-checked_in { background-color: #36b9cc; color: white; }
    .status-in_progress { background-color: #4e73df; color: white; }
    .status-completed { background-color: #1cc88a; color: white; }
    .status-cancelled { background-color: #e74a3b; color: white; }
    .status-no_show { background-color: #5a5c69; color: white; }
    
    .billing-pending { background-color: #f6c23e; color: white; }
    .billing-submitted { background-color: #36b9cc; color: white; }
    .billing-paid { background-color: #1cc88a; color: white; }
    .billing-denied { background-color: #e74a3b; color: white; }
    .billing-partial { background-color: #fd7e14; color: white; }
    
    .stats-card {
        background: linear-gradient(45deg, #4e73df, #224abe);
        color: white;
        border-radius: 0.35rem;
        padding: 1.5rem;
        text-align: center;
        margin-bottom: 1rem;
    }
    
    .stats-number {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
    }
    
    .stats-label {
        font-size: 0.9rem;
        opacity: 0.9;
    }
    
    .filter-section {
        background: white;
        border-radius: 0.35rem;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
    }
    
    .patient-info {
        border-left: 4px solid #4e73df;
        padding-left: 1rem;
        margin-bottom: 1rem;
    }
    
    .clinical-summary {
        background: #f8f9fc;
        border-radius: 0.35rem;
        padding: 1rem;
        margin: 1rem 0;
    }
    
    .timeline-item {
        border-left: 2px solid #e3e6f0;
        padding-left: 1rem;
        margin-bottom: 1rem;
        position: relative;
    }
    
    .timeline-item::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 0;
        width: 10px;
        height: 10px;
        background: #4e73df;
        border-radius: 50%;
    }
    
    .encounter-actions {
        position: sticky;
        top: 20px;
        background: white;
        border-radius: 0.35rem;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        padding: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    
    <!-- Page Heading -->
    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-file-medical text-primary"></i>
            診療記錄管理
        </h1>
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-primary" id="btnNewEncounter">
                <i class="fas fa-plus"></i> 新增診療記錄
            </button>
            <button type="button" class="btn btn-success" id="btnTodayEncounters">
                <i class="fas fa-calendar-day"></i> 今日診療
            </button>
            <button type="button" class="btn btn-info" id="btnRefreshEncounters">
                <i class="fas fa-sync-alt"></i> 重新整理
            </button>
        </div>
    </div>

    <!-- Statistics Row -->
    <div class="row" id="statsRow">
        <div class="col-xl-3 col-md-6">
            <div class="stats-card">
                <div class="stats-number" id="todayEncounters">0</div>
                <div class="stats-label">今日診療</div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="stats-card" style="background: linear-gradient(45deg, #4e73df, #2653d3);">
                <div class="stats-number" id="inProgressEncounters">0</div>
                <div class="stats-label">進行中</div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="stats-card" style="background: linear-gradient(45deg, #1cc88a, #17a673);">
                <div class="stats-number" id="completedToday">0</div>
                <div class="stats-label">今日完成</div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="stats-card" style="background: linear-gradient(45deg, #f6c23e, #dda20a);">
                <div class="stats-number" id="pendingBilling">0</div>
                <div class="stats-label">待計費</div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filter-section">
        <h5 class="mb-3">篩選條件</h5>
        <div class="row">
            <div class="col-md-3">
                <div class="form-group">
                    <label for="filterStatus">診療狀態</label>
                    <select class="form-control" id="filterStatus">
                        <option value="">所有狀態</option>
                        <option value="scheduled">已安排</option>
                        <option value="checked_in">已報到</option>
                        <option value="in_progress">進行中</option>
                        <option value="completed">已完成</option>
                        <option value="cancelled">已取消</option>
                        <option value="no_show">未到</option>
                    </select>
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label for="filterBilling">計費狀態</label>
                    <select class="form-control" id="filterBilling">
                        <option value="">所有狀態</option>
                        <option value="pending">待計費</option>
                        <option value="submitted">已提交</option>
                        <option value="paid">已付款</option>
                        <option value="denied">已拒絕</option>
                        <option value="partial">部分付款</option>
                    </select>
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label for="filterProvider">醫護人員</label>
                    <select class="form-control" id="filterProvider">
                        <option value="">所有醫護人員</option>
                    </select>
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label for="filterDate">日期範圍</label>
                    <input type="date" class="form-control" id="filterDate">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="searchPatient">病患搜尋</label>
                    <input type="text" class="form-control" id="searchPatient" placeholder="輸入病患姓名或ID">
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="searchEncounter">診療記錄搜尋</label>
                    <input type="text" class="form-control" id="searchEncounter" placeholder="輸入診療編號或主訴">
                </div>
            </div>
        </div>
    </div>

    <!-- Encounters List -->
    <div class="row">
        <div class="col-lg-8">
            <div id="encountersContainer">
                <!-- Encounters will be loaded here -->
                <div class="text-center" id="loadingIndicator">
                    <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
                    <p class="mt-2">載入診療記錄中...</p>
                </div>
            </div>
            
            <!-- Pagination -->
            <div class="d-flex justify-content-center mt-4">
                <nav>
                    <ul class="pagination" id="encountersPagination">
                        <!-- Pagination will be generated here -->
                    </ul>
                </nav>
            </div>
        </div>
        
        <div class="col-lg-4">
            <div class="encounter-actions">
                <h6 class="mb-3">
                    <i class="fas fa-tools text-primary"></i>
                    快速操作
                </h6>
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" id="btnQuickCheckin">
                        <i class="fas fa-sign-in-alt"></i> 快速報到
                    </button>
                    <button class="btn btn-outline-success" id="btnQuickComplete">
                        <i class="fas fa-check-circle"></i> 標記完成
                    </button>
                    <button class="btn btn-outline-info" id="btnBulkActions">
                        <i class="fas fa-tasks"></i> 批量操作
                    </button>
                </div>
                
                <hr>
                
                <h6 class="mb-3">
                    <i class="fas fa-chart-pie text-primary"></i>
                    今日統計
                </h6>
                <div id="todayStats">
                    <!-- Today's statistics will be loaded here -->
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Encounter Detail Modal -->
<div class="modal fade" id="encounterModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="encounterModalTitle">診療記錄詳情</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="encounterModalBody">
                <!-- Encounter details will be loaded here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">關閉</button>
                <button type="button" class="btn btn-primary" id="editEncounter">編輯</button>
                <button type="button" class="btn btn-success" id="markComplete">標記完成</button>
                <button type="button" class="btn btn-info" id="printEncounter">列印</button>
            </div>
        </div>
    </div>
</div>

<!-- New Encounter Modal -->
<div class="modal fade" id="newEncounterModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增診療記錄</h5>
                <button type="button" class="close" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="newEncounterForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="encounterPatient">病患 *</label>
                                <select class="form-control" id="encounterPatient" required>
                                    <option value="">請選擇病患</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="encounterProvider">主治醫師 *</label>
                                <select class="form-control" id="encounterProvider" required>
                                    <option value="">請選擇醫師</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="encounterCategory">診療類別 *</label>
                                <select class="form-control" id="encounterCategory" required>
                                    <option value="">請選擇診療類別</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="encounterDate">診療日期 *</label>
                                <input type="datetime-local" class="form-control" id="encounterDate" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="chiefComplaint">主訴 *</label>
                        <textarea class="form-control" id="chiefComplaint" rows="3" required placeholder="病患主要不適或就診原因..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="reasonForVisit">就診原因</label>
                        <textarea class="form-control" id="reasonForVisit" rows="2" placeholder="詳細就診原因..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="saveNewEncounter">建立診療記錄</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    let currentPage = 1;
    let selectedEncounters = [];
    
    // Initialize
    loadStatistics();
    loadProviders();
    loadEncounterCategories();
    loadPatients();
    loadEncounters();
    
    // Set today's date as default
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    $('#filterDate').val(todayStr);
    
    // Set default datetime for new encounters
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    $('#encounterDate').val(now.toISOString().slice(0, 16));
    
    // Event handlers
    $('#filterStatus, #filterBilling, #filterProvider, #filterDate').on('change', function() {
        currentPage = 1;
        loadEncounters();
    });
    
    $('#searchPatient, #searchEncounter').on('input', debounce(function() {
        currentPage = 1;
        loadEncounters();
    }, 500));
    
    $('#btnNewEncounter').on('click', function() {
        $('#newEncounterModal').modal('show');
    });
    
    $('#btnTodayEncounters').on('click', function() {
        $('#filterDate').val(todayStr);
        $('#filterStatus').val('');
        currentPage = 1;
        loadEncounters();
    });
    
    $('#btnRefreshEncounters').on('click', function() {
        loadStatistics();
        loadEncounters();
    });
    
    function loadStatistics() {
        $.get('/api/v1/encounters/api/encounters/statistics/')
            .done(function(data) {
                $('#todayEncounters').text(data.today_total || 0);
                $('#inProgressEncounters').text(data.in_progress || 0);
                $('#completedToday').text(data.completed_today || 0);
                $('#pendingBilling').text(data.pending_billing || 0);
            })
            .fail(function() {
                // Use default values if API fails
                $('#todayEncounters, #inProgressEncounters, #completedToday, #pendingBilling').text(0);
            });
    }
    
    function loadProviders() {
        $.get('/api/v1/administration/api/users/')
            .done(function(data) {
                const select = $('#filterProvider, #encounterProvider');
                select.empty();
                $('#filterProvider').append('<option value="">所有醫護人員</option>');
                $('#encounterProvider').append('<option value="">請選擇醫師</option>');
                
                if (data.results) {
                    data.results.forEach(function(provider) {
                        if (provider.role && (provider.role.includes('doctor') || provider.role.includes('physician'))) {
                            const option = `<option value="${provider.id}">${provider.first_name} ${provider.last_name}</option>`;
                            select.append(option);
                        }
                    });
                }
            });
    }
    
    function loadEncounterCategories() {
        $.get('/api/v1/encounters/api/encounter-categories/')
            .done(function(data) {
                const select = $('#encounterCategory');
                select.empty().append('<option value="">請選擇診療類別</option>');
                data.forEach(function(category) {
                    select.append(`<option value="${category.id}">${category.name}</option>`);
                });
            });
    }
    
    function loadPatients() {
        $.get('/api/v1/patients/api/patients/')
            .done(function(data) {
                const select = $('#encounterPatient');
                select.empty().append('<option value="">請選擇病患</option>');
                
                if (data.results) {
                    data.results.forEach(function(patient) {
                        select.append(`<option value="${patient.id}">${patient.first_name} ${patient.last_name}</option>`);
                    });
                }
            });
    }
    
    function loadEncounters() {
        const params = getFilterParams();
        
        $('#loadingIndicator').show();
        $('#encountersContainer').find('.encounter-card').remove();
        
        $.get('/api/v1/encounters/api/encounters/', params)
            .done(function(data) {
                $('#loadingIndicator').hide();
                renderEncounters(data.results || data);
                renderPagination(data);
            })
            .fail(function() {
                $('#loadingIndicator').hide();
                $('#encountersContainer').html(`
                    <div class="text-center text-muted">
                        <i class="fas fa-exclamation-circle fa-2x"></i>
                        <p class="mt-2">無法載入診療記錄</p>
                    </div>
                `);
            });
    }
    
    function getFilterParams() {
        const params = {
            page: currentPage
        };
        
        const status = $('#filterStatus').val();
        const billing = $('#filterBilling').val();
        const provider = $('#filterProvider').val();
        const date = $('#filterDate').val();
        const patientSearch = $('#searchPatient').val();
        const encounterSearch = $('#searchEncounter').val();
        
        if (status) params.encounter_status = status;
        if (billing) params.billing_status = billing;
        if (provider) params.primary_provider = provider;
        if (date) params.encounter_date = date;
        if (patientSearch) params.patient_search = patientSearch;
        if (encounterSearch) params.search = encounterSearch;
        
        return params;
    }
    
    function renderEncounters(encounters) {
        const container = $('#encountersContainer');
        
        if (!encounters || encounters.length === 0) {
            container.html(`
                <div class="text-center text-muted">
                    <i class="fas fa-clipboard-list fa-2x"></i>
                    <p class="mt-2">目前沒有符合條件的診療記錄</p>
                </div>
            `);
            return;
        }
        
        encounters.forEach(function(encounter) {
            const encounterCard = createEncounterCard(encounter);
            container.append(encounterCard);
        });
    }
    
    function createEncounterCard(encounter) {
        const statusClass = 'status-' + encounter.encounter_status;
        const billingClass = 'billing-' + encounter.billing_status;
        const statusText = getStatusText(encounter.encounter_status);
        const billingText = getBillingText(encounter.billing_status);
        
        return $(`
            <div class="encounter-card" data-encounter-id="${encounter.id}">
                <div class="card-body p-3">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="patient-info">
                                <h6 class="mb-1">
                                    <i class="fas fa-user text-primary"></i>
                                    ${encounter.patient_name || 'N/A'}
                                    <small class="text-muted ml-2">#${encounter.encounter_number}</small>
                                </h6>
                                <p class="mb-1">
                                    <strong>主治醫師:</strong> ${encounter.provider_name || 'N/A'}
                                    <span class="ml-3"><strong>診療類別:</strong> ${encounter.category_name || 'N/A'}</span>
                                </p>
                                <p class="mb-1">
                                    <strong>診療時間:</strong> ${formatDateTime(encounter.encounter_date)}
                                </p>
                            </div>
                            <div class="clinical-summary">
                                <p class="mb-1"><strong>主訴:</strong> ${encounter.chief_complaint || '無'}</p>
                                ${encounter.reason_for_visit ? `<p class="mb-0"><strong>就診原因:</strong> ${encounter.reason_for_visit}</p>` : ''}
                            </div>
                        </div>
                        <div class="col-md-4 text-right">
                            <div class="mb-2">
                                <span class="status-badge ${statusClass}">${statusText}</span>
                                <br>
                                <span class="status-badge ${billingClass} mt-1">${billingText}</span>
                            </div>
                            <div class="btn-group-vertical btn-group-sm">
                                <button class="btn btn-outline-primary btn-view-encounter" data-id="${encounter.id}">
                                    <i class="fas fa-eye"></i> 檢視
                                </button>
                                <button class="btn btn-outline-success btn-edit-encounter" data-id="${encounter.id}">
                                    <i class="fas fa-edit"></i> 編輯
                                </button>
                                ${encounter.encounter_status === 'checked_in' ? 
                                    `<button class="btn btn-outline-info btn-start-encounter" data-id="${encounter.id}">
                                        <i class="fas fa-play"></i> 開始
                                    </button>` : ''}
                                ${encounter.encounter_status === 'in_progress' ? 
                                    `<button class="btn btn-outline-warning btn-complete-encounter" data-id="${encounter.id}">
                                        <i class="fas fa-check"></i> 完成
                                    </button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `);
    }
    
    function getStatusText(status) {
        const statusTexts = {
            'scheduled': '已安排',
            'checked_in': '已報到',
            'in_progress': '進行中',
            'completed': '已完成',
            'cancelled': '已取消',
            'no_show': '未到'
        };
        return statusTexts[status] || status;
    }
    
    function getBillingText(status) {
        const billingTexts = {
            'pending': '待計費',
            'submitted': '已提交',
            'paid': '已付款',
            'denied': '已拒絕',
            'partial': '部分付款'
        };
        return billingTexts[status] || status;
    }
    
    function formatDateTime(dateTimeStr) {
        if (!dateTimeStr) return 'N/A';
        const date = new Date(dateTimeStr);
        return date.toLocaleString('zh-TW');
    }
    
    function renderPagination(data) {
        const pagination = $('#encountersPagination');
        pagination.empty();
        
        if (!data.count || data.count <= 10) return;
        
        const totalPages = Math.ceil(data.count / 10);
        
        // Previous button
        if (data.previous) {
            pagination.append(`
                <li class="page-item">
                    <a class="page-link" href="#" data-page="${currentPage - 1}">上一頁</a>
                </li>
            `);
        }
        
        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
            if (i === currentPage) {
                pagination.append(`<li class="page-item active"><span class="page-link">${i}</span></li>`);
            } else {
                pagination.append(`<li class="page-item"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`);
            }
        }
        
        // Next button
        if (data.next) {
            pagination.append(`
                <li class="page-item">
                    <a class="page-link" href="#" data-page="${currentPage + 1}">下一頁</a>
                </li>
            `);
        }
    }
    
    // Event delegation for dynamic buttons
    $(document).on('click', '.btn-view-encounter', function() {
        const encounterId = $(this).data('id');
        viewEncounter(encounterId);
    });
    
    $(document).on('click', '.page-link', function(e) {
        e.preventDefault();
        const page = $(this).data('page');
        if (page) {
            currentPage = page;
            loadEncounters();
        }
    });
    
    function viewEncounter(encounterId) {
        // This would load detailed encounter information
        $('#encounterModal').modal('show');
        // Implementation to load encounter details would go here
    }
    
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }
    
    // Save new encounter
    $('#saveNewEncounter').on('click', function() {
        const formData = {
            patient: $('#encounterPatient').val(),
            primary_provider: $('#encounterProvider').val(),
            category: $('#encounterCategory').val(),
            encounter_date: $('#encounterDate').val(),
            chief_complaint: $('#chiefComplaint').val(),
            reason_for_visit: $('#reasonForVisit').val()
        };
        
        $.post('/api/v1/encounters/api/encounters/', formData)
            .done(function() {
                $('#newEncounterModal').modal('hide');
                showNotification('診療記錄建立成功', 'success');
                loadEncounters();
                loadStatistics();
                
                // Reset form
                $('#newEncounterForm')[0].reset();
            })
            .fail(function(xhr) {
                const errors = xhr.responseJSON;
                let message = '診療記錄建立失敗';
                if (errors && typeof errors === 'object') {
                    message += ': ' + Object.values(errors).flat().join(', ');
                }
                showNotification(message, 'error');
            });
    });
    
    function showNotification(message, type) {
        const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
        const icon = type === 'success' ? 'check-circle' : 'exclamation-circle';
        
        const notification = $(`
            <div class="alert ${alertClass} alert-dismissible fade show position-fixed" 
                 style="top: 20px; right: 20px; z-index: 9999;" role="alert">
                <i class="fas fa-${icon}"></i> ${message}
                <button type="button" class="close" data-dismiss="alert">
                    <span>&times;</span>
                </button>
            </div>
        `);
        
        $('body').append(notification);
        
        setTimeout(function() {
            notification.alert('close');
        }, 3000);
    }
});
</script>
{% endblock %}
